# RKLB company KPI override (layer 3). Manual values are verbatim figures from
# Tier-1 earnings releases already stored in management/statements.json.
# Backlog is company-defined and kept separate from ASC 606 RPO even when the
# two are numerically close.
ticker: RKLB
sector: space
draft_auto: true
review_required: true
kpis:
  launch_cadence:
    definition: launches as the company counts them; Electron-only and Electron + HASTE counts are different definitions
values:
  - {kpi: backlog, period: Q3 FY2024, date: "2024-09-30", value: 1050, original_name: backlog,
     definition: "company-defined backlog (release wording 'backlog at $1.05 billion')",
     source: "https://www.sec.gov/Archives/edgar/data/1819994/000095017024125448/rklb-ex99_1.htm",
     source_type: "issuer earnings release (8-K Item 2.02)", confidence: medium}
  - {kpi: backlog, period: FY2025, date: "2025-12-31", value: 1850, original_name: backlog,
     definition: "company-defined backlog (release wording 'record $1.85 billion in backlog')",
     source: "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000012/rklb-02262026ex991.htm",
     source_type: "issuer earnings release (8-K Item 2.02)", confidence: medium}
  - {kpi: backlog, period: Q1 FY2026, date: "2026-03-31", value: 2200, original_name: backlog,
     definition: "company-defined backlog (release wording '$2.2 billion in backlog'; headline says 'over $2.2B')",
     source: "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000027/rklb-05072026ex991.htm",
     source_type: "issuer earnings release (8-K Item 2.02)", confidence: medium}
  - {kpi: backlog, period: Q2 FY2026, date: "2026-06-30", value: 2360, original_name: backlog,
     definition: "company-defined backlog (release wording 'backlog grow to $2.36 billion')",
     source: "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000061/rklb-08102026ex991.htm",
     source_type: "issuer earnings release (8-K Item 2.02)", confidence: medium}
  - {kpi: launch_cadence, period: FY2024, date: "2024-12-31", value: 16, original_name: "launches for Electron",
     definition: "Electron launches only",
     source: "https://www.sec.gov/Archives/edgar/data/1819994/000162828025008658/rklb-ex99_1.htm",
     source_type: "issuer earnings release (8-K Item 2.02)", confidence: medium}
  - {kpi: launch_cadence, period: FY2025, date: "2025-12-31", value: 21, original_name: "missions across Electron and HASTE",
     definition: "Electron + HASTE missions; not comparable 1:1 with the FY2024 Electron-only count",
     source: "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000012/rklb-02262026ex991.htm",
     source_type: "issuer earnings release (8-K Item 2.02)", confidence: medium}
  - {kpi: launch_cadence, period: Q4 FY2025, date: "2025-12-31", value: 7, original_name: "missions in Q4 2025",
     source: "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000012/rklb-02262026ex991.htm",
     source_type: "issuer earnings release (8-K Item 2.02)", confidence: medium}
guidance_metrics:
  revenue:
    company_definition: GAAP revenue
    actual: {type: sec_history, metric: revenue}
    comparison_basis: gaap_match
  gross_margin:
    company_definition: GAAP gross margin
    actual: {type: sec_history, metric: gross_margin_pct}
    comparison_basis: gaap_match
  gaap_operating_expenses:
    company_definition: GAAP operating expenses
    actual: {type: calculation, formula: gross_profit - operating_income}
    actual_definition: GAAP gross profit minus GAAP operating income (Calculation from financials/history.json)
    comparison_basis: calculated_gaap
  basic_shares_guided:
    company_definition: >-
      basic weighted average common shares outstanding, from 2025 releases
      INCLUDING ~41-51m Series A Convertible Participating Preferred shares;
      2024 releases say "Basic Shares Outstanding"
    actual: {type: sec_history, metric: basic_shares}
    actual_definition: XBRL weighted average basic common shares (excludes preferred)
    comparison_basis: definition_mismatch
milestone_subjects: [Neutron, Electron, HASTE, Archimedes]
