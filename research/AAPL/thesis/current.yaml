components:
  ecosystem_cash_generation:
    importance: high
    status: supported
    evidence:
      - "Calculation: TTM CFO $146.7bn and reported FCF (CFO - PP&E capex) $136.7bn to Q3 FY2026 (financial-data.json, SEC XBRL)."
      - "Assumption: normalized FCFF proxy about $120.5bn after removing one-offs (normalized-valuation-output.json)."
