    importance: high
    status: uncertain
    evidence:
      - "Fact: Services were $109.2bn, about 26.2% of FY2025 revenue (FY2025 10-K)."
      - "Fact: EU terms effective 2026-10-01 replace the per-install CTF with a 5% Core Technology Commission on certain off-store digital sales; revenue effect undisclosed (Apple developer terms)."
    last_updated: '2026-10-11'
    next_check: FY2026 10-K Services growth and any EU / Google disclosures
    invalidation_condition: Services growth stalls for consecutive quarters (not FX or an explainable base effect), or a verifiable structural adverse ruling on Google revenue sharing.
