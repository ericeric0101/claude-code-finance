    last_updated: '2026-10-11'
    next_check: Q4 FY2026 gross margin excluding refunds
    invalidation_condition: Gross margin falls below the FY2024-FY2025 range after removing one-offs, with weaker cash conversion.
  management_transition:
    importance: medium
    status: uncertain
    evidence:
